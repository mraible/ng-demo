name: Angular

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    env:
      # Secrets aren't available to pull requests from forks or Dependabot
      HAS_E2E_SECRETS: ${{ secrets.E2E_DOMAIN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --watch=false
      - name: Run integration tests
        uses: cypress-io/github-action@bc982daf1fc26474fa0cf2c355d6c910616ce411 # v7.4.7
        with:
          start: npm start
          install: false
          wait-on: http://localhost:4200
        if: env.HAS_E2E_SECRETS == 'true'
        env:
          CYPRESS_E2E_DOMAIN: ${{ secrets.E2E_DOMAIN }}
          CYPRESS_E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          CYPRESS_E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
