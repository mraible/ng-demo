name: Sync bonus branches
# Rebases each bonus branch (one commit per section of its tutorial) onto main after every push to main, regenerates
# the tutorials from the rebased branches, updates the versions pinned in README.adoc to match package.json (since
# Dependabot only updates package.json), and commits them to main if they changed. It opens an issue if a branch
# can't be rebased or pushed, or if the tutorials can't be generated or pushed. Once a week, it also opens an issue
# if a package that only a bonus branch uses has a new version, because Dependabot only updates main.
# package.json conflicts from Dependabot bumps on main are merged by .github/bonus/merge-package-json.py, and each
# replayed commit's package-lock.json is updated with npm by .github/bonus/update-lock.sh.
# The branches are pushed with the BONUS_SYNC_TOKEN secret, a fine-grained personal access token with read and write
# access to this repository's contents and workflows. GITHUB_TOKEN can't push changes to .github/workflows, and its
# pushes don't trigger CI. Pushing with a personal access token runs CI on each branch and reports failures to you.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: sync-bonus-branches
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.read.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "names=$(jq -c keys .github/bonus/branches.json)" >> "$GITHUB_OUTPUT"
  rebase:
    needs: branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.branches.outputs.names) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          token: ${{ secrets.BONUS_SYNC_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Rebase ${{ matrix.branch }} onto main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Use main's merge scripts, since the branch's copies can be older
          git show origin/main:.github/bonus/merge-package-json.py > "$RUNNER_TEMP/merge-package-json.py"
          git show origin/main:.github/bonus/update-lock.sh > "$RUNNER_TEMP/update-lock.sh"
          chmod +x "$RUNNER_TEMP/update-lock.sh"
          printf 'package.json merge=package-json\npackage-lock.json merge=keep-ours\n' > "$RUNNER_TEMP/gitattributes"
          git config core.attributesFile "$RUNNER_TEMP/gitattributes"
          git config merge.package-json.driver "python3 $RUNNER_TEMP/merge-package-json.py %O %A %B"
          git config merge.keep-ours.driver true
          commits=$(git show origin/main:.github/bonus/branches.json | jq -r '.["${{ matrix.branch }}"].commits')
          # Stop instead of dropping a commit that becomes empty, so the branch keeps one commit per section
          if ! git rebase --empty=stop --exec "$RUNNER_TEMP/update-lock.sh" --onto origin/main "HEAD~$commits"; then
            git rebase --abort
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/${{ matrix.branch }})" ]; then
            git push --force-with-lease=${{ matrix.branch }}:origin/${{ matrix.branch }} origin HEAD:${{ matrix.branch }}
          fi
      - name: Open an issue
        if: failure()
        run: |
          title='The ${{ matrix.branch }} branch needs attention'
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "After ${GITHUB_SHA::7} was pushed to main, the ${{ matrix.branch }} branch couldn't be rebased onto main and pushed. If the rebase failed, rebase it onto main and fix the conflicts, keeping one commit per section of its tutorial and updating its commit count in \`.github/bonus/branches.json\` if that changes, then run \`python3 .github/bonus/generate.py ${{ matrix.branch }}\` on main and commit the tutorial if it changed. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
  snippets:
    needs: rebase
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BONUS_SYNC_TOKEN }}
      - name: Regenerate the tutorials, update their pinned versions, and commit them if they changed
        run: |
          python3 .github/bonus/generate.py --remote origin
          python3 .github/check-versions.py --fix
          if [ -n "$(git status --porcelain -- '*.adoc')" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --quiet -m 'Update the tutorials to match the bonus branches and package.json' -- '*.adoc'
            # This push runs the workflow again, which rebases the branches onto this commit
            git push origin HEAD:main
          fi
      - name: Open an issue
        if: failure()
        run: |
          title='The bonus tutorials are out of date'
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "After ${GITHUB_SHA::7} was pushed to main, the tutorials couldn't be regenerated from their branches or pushed to main. Run \`python3 .github/bonus/generate.py\` and \`python3 .github/check-versions.py --fix\` on main and commit the changes. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
  outdated:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Find new versions of the bonus branches' packages
        id: check
        run: |
          python3 .github/bonus/outdated.py --remote origin | tee "$RUNNER_TEMP/outdated.md"
          [ -s "$RUNNER_TEMP/outdated.md" ] && echo "found=true" >> "$GITHUB_OUTPUT" || true
      - name: Open an issue
        if: steps.check.outputs.found == 'true'
        run: |
          title='The bonus branches have outdated packages'
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body-file - <<EOF
          Dependabot only updates main, so these packages that only the bonus branches use have new versions:

          $(cat "$RUNNER_TEMP/outdated.md")

          Update each one in the commit that adds it (with \`npm install --save-exact\`), then run \`python3 .github/bonus/generate.py\` on main and commit the tutorials. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.
          EOF
          fi
