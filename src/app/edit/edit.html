@if (person(); as person) {
  <div class="col-8">
    <h3 class="mt-2">{{ person.name }}</h3>
    <form (ngSubmit)="save()" #editForm="ngForm">
      <div>
        <label>Id:</label>
        {{ person.id }}
      </div>
      <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input
          [(ngModel)]="person.name"
          name="name"
          id="name"
          placeholder="Name"
          required
          class="form-control"
          #name="ngModel"
          [class.is-invalid]="name.touched && name.invalid"
          [class.is-valid]="name.touched && name.valid"
        />
        <div [hidden]="name.valid || name.pristine" style="display: block" class="invalid-feedback">Name is required</div>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone:</label>
        <input [(ngModel)]="person.phone" name="phone" id="phone" placeholder="Phone" class="form-control" />
      </div>
      <fieldset class="mb-3">
        <legend>Address:</legend>
        <address>
          <input [(ngModel)]="person.address.street" name="street" id="street" class="form-control mb-2" />
          <div class="row">
            <div class="col-6">
              <input [(ngModel)]="person.address.city" name="city" id="city" class="form-control" />
            </div>
            <div class="col-3">
              <input [(ngModel)]="person.address.state" name="state" id="state" size="2" class="form-control" />
            </div>
            <div class="col-3">
              <input [(ngModel)]="person.address.zip" name="zip" id="zip" size="5" class="form-control" />
            </div>
          </div>
        </address>
      </fieldset>
      <button type="submit" id="save" class="btn btn-primary me-1" [disabled]="!editForm.form.valid">Save</button>
      <button type="button" (click)="cancel()" id="cancel" class="btn btn-light">Cancel</button>
    </form>
  </div>
}
