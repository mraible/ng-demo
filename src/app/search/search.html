<h2>Search</h2>
<form>
  <mat-form-field>
    <input matInput type="search" name="query" placeholder="Search" [(ngModel)]="query" (keyup.enter)="search()" />
  </mat-form-field>
  <button mat-mini-fab type="button" (click)="search()"><mat-icon>search</mat-icon></button>
</form>
@if (searchResults().length) {
  <mat-list>
    @for (person of searchResults(); track person.id) {
      <mat-list-item lines="3">
        <span matListItemTitle><a [routerLink]="['/edit', person.id]">{{ person.name }}</a></span>
        <span matListItemLine>{{ person.phone }}</span>
        <span matListItemLine>
          {{ person.address.street }}, {{ person.address.city }}, {{ person.address.state }} {{ person.address.zip }}
        </span>
      </mat-list-item>
    }
  </mat-list>
}
